{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoklabariAI - Login</title>

    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
    <script src="{% static 'accounts/js/login.js' %}" defer></script>
</head>

<body>
    {% if messages %}
        <div id="msg-container">
            {% for message in messages %}
                <div class="alert {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="background"></div>

    <div class="login-container">
        <div class="left-panel">
            <div class="logo">
                <svg width="260" height="60" viewBox="0 0 260 60" xmlns="http://www.w3.org/2000/svg" aria-label="HoklabariAI">
                    <defs>
                        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2D9CDB"/>
                            <stop offset="100%" stop-color="#56CCF2"/>
                        </linearGradient>
                    </defs>

                    <rect x="5" y="10" rx="12" ry="12" width="40" height="40" fill="url(#grad)"/>
                    <circle cx="20" cy="30" r="3" fill="white"/>
                    <circle cx="30" cy="30" r="3" fill="white"/>
                    <rect x="18" y="36" width="14" height="3" rx="2" fill="white"/>

                    <text x="55" y="38" font-family="Arial, sans-serif" font-size="20" fill="white">
                        Hoklabari<tspan fill="url(#grad)">AI</tspan>
                    </text>
                </svg>
            </div>

            <p class="tagline">
                Your intelligent AI companion for smarter conversations.
            </p>
        </div>

        <div class="right-panel">
            <div class="login-box">
                <h2>Welcome Back</h2>
                <p>Login to continue chatting</p>

                <form method="POST">
                    {% csrf_token %}

                    <input type="text" name="username" placeholder="Username" autocomplete="username" required>
                    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>

                    <button id="login-btn" type="submit">Login</button>
                </form>

                <p class="bottom-text">
                    New here? <a href="{% url 'register' %}">Create account</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
